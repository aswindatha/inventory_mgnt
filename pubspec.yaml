name: inventorymgnt
description: "Multi-user, multi-site electronics inventory and project management."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.4.3

  # Backend (Supabase: Postgres + Auth + RLS + Storage)
  supabase_flutter: ^2.17.2
  # Declared directly because `lib/data/remote/backend.dart` names Postgrest's
  # builder types in its query API. Relying on it transitively would be
  # depending on an implementation detail of supabase_flutter.
  postgrest: ^2.9.1

  # Local cache / offline-first mirror
  drift: ^2.35.0
  sqlite3: ^3.6.0          # ships its own native libs as of 3.x
  path_provider: ^2.1.6
  path: ^1.9.1

  # Networking. `dio` is used throughout instead of `http`: cart automation
  # (spec §6) needs redirect control and a cookie jar to carry a vendor session,
  # which `http` does not provide. One client, not two.
  dio: ^5.11.1

  # Scraping
  html: ^0.15.7

  # Images
  cached_network_image: ^4.0.0

  # Cart automation fallback (spec §6)
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.2

  # Navigation
  go_router: ^18.0.1

  # Utilities
  collection: ^1.19.1
  intl: ^0.20.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # On-device end-to-end tests (integration_test/full_journey_test.dart).
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # drift code generation
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

  mocktail: ^1.0.5

flutter:
  uses-material-design: true
